name: assemble imported patch 0006

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout LimbusTailor
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble and verify patch 0006
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p patches
          : > patches/0006-hard-page-boundary-and-output-ui.patch
          for f in \
            .migration/0006.part01 \
            .migration/0006.part02 \
            .migration/0006.part03 \
            .migration/0006.part04 \
            .migration/0006.part05 \
            .migration/0006.part06; do
            cat "$f" >> patches/0006-hard-page-boundary-and-output-ui.patch
            printf '\n' >> patches/0006-hard-page-boundary-and-output-ui.patch
          done

          actual="$(git hash-object patches/0006-hard-page-boundary-and-output-ui.patch)"
          expected="da234cc19a0944f6e460c7228d3cbbfde70729e4"
          echo "expected=$expected"
          echo "actual=$actual"
          test "$actual" = "$expected"

      - name: Finalize clean import
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf .migration
          rm -f .github/workflows/_assemble-0006.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: finish exact import of patch 0006"
          git push origin HEAD:main
