name: tmp physical page clamp

on:
  push:
    branches:
      - work/physical-page-clamp
    paths:
      - .physical-page-trigger
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout LimbusTailor
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Regenerate patch 0006 with physical page clamp
        shell: bash
        run: bash .github/scripts/physical-page-clamp.sh
