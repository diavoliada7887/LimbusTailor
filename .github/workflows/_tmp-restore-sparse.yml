name: tmp restore sparse protection

on:
  push:
    branches:
      - work/physical-page-first
    paths:
      - '.restore-sparse-trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore sparse protection inside physical page
        shell: bash
        run: |
          set -euxo pipefail
          ROOT="$PWD"
          git clone https://github.com/trufanov-nok/scantailor-universal.git /tmp/stu
          cd /tmp/stu
          git checkout c1a7d797160c12aef32a19e7e08f2e099c8f3292
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for p in 0001-output-formats.patch 0002-content-padding-mm.patch 0003-sparse-page-protection.patch 0004-modern-windows-portable-build.patch 0005-modern-exiv2-windows.patch; do
            git apply "$ROOT/patches/$p"
          done
          git add -A
          git commit -m "baseline after patches 0001-0005"
          BASE=$(git rev-parse HEAD)
          git apply "$ROOT/patches/0006-hard-page-boundary-and-output-ui.patch"

          python3 - <<'PY'
          from pathlib import Path
          p = Path('/tmp/stu/src/core/filters/select_content/Task.cpp')
          text = p.read_text()
          marker = '''                    // ScanTailor's own page geometry remains the final guard.\n                    content_rect = content_rect.intersected(page_rect);\n'''
          if text.count(marker) != 1:
              raise SystemExit(f'final guard marker count={text.count(marker)}')
          sparse = '''                    // Preserve the existing sparse-page protection, but make\n                    // its restored project frame obey the same physical sheet\n                    // boundary as corner protection and safety margins.\n                    const bool protect_sparse = archiveSettings.value(\n                        _key_content_sel_sparse_protection, _key_content_sel_sparse_protection_def\n                    ).toBool();\n                    const int shrink_percent = archiveSettings.value(\n                        _key_content_sel_sparse_tolerance_percent, _key_content_sel_sparse_tolerance_percent_def\n                    ).toInt();\n                    const QRectF typical_frame = m_ptrSettings->typicalContentFrame(5);\n                    if (protect_sparse && typical_frame.isValid() && !typical_frame.isEmpty()\n                        && page_rect.isValid() && !page_rect.isEmpty()) {\n                        const QRectF typical_rect(\n                            page_rect.left() + typical_frame.left() * page_rect.width(),\n                            page_rect.top() + typical_frame.top() * page_rect.height(),\n                            typical_frame.width() * page_rect.width(),\n                            typical_frame.height() * page_rect.height()\n                        );\n                        const double min_factor = 1.0 - qBound(5, shrink_percent, 60) / 100.0;\n                        const bool suspicious_shrink =\n                            content_rect.width() < typical_rect.width() * min_factor ||\n                            content_rect.height() < typical_rect.height() * min_factor;\n\n                        if (suspicious_shrink) {\n                            const QRectF restored = content_rect.united(typical_rect);\n                            if (physical_page.size() == 4) {\n                                content_rect = archiveClampPaddingToPhysicalPage(\n                                    content_rect, restored, physical_page, inset_x, inset_y\n                                );\n                            } else {\n                                content_rect = restored.intersected(page_rect);\n                            }\n                        }\n                    }\n\n''' + marker
          text = text.replace(marker, sparse, 1)
          p.write_text(text)
          PY

          git diff --binary "$BASE" > "$ROOT/patches/0006-hard-page-boundary-and-output-ui.patch"
          git reset --hard "$BASE"
          git clean -fdx
          git apply --check "$ROOT/patches/0006-hard-page-boundary-and-output-ui.patch"
          git apply "$ROOT/patches/0006-hard-page-boundary-and-output-ui.patch"

          cd "$ROOT"
          git add patches/0006-hard-page-boundary-and-output-ui.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: preserve sparse protection inside page boundary"
          git push origin HEAD:work/physical-page-first
